.sheet{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.flag{border-left:4px solid var(--note-line);background:var(--note);padding:10px 14px;font-size:15px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:210px 150px 1fr;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0} .row>*{min-width:0}

ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.rubric td:first-child{width:60px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}

const TIERS = {official:"official record", transcript:"transcript", major:"major outlet", other:"other outlet"};
function tier(url){
  const h = new URL(url).hostname.replace(/^www\./, "");
  const k = /(^|\.)senate\.gov$|govinfo\.gov$/.test(h) ? "official"
    : /techpolicy\.press$|chinatalk\.media$/.test(h) ? "transcript"
    : /cbsnews\.com$|axios\.com$|newsweek\.com$|forbes\.com$|wcax\.com$/.test(h) ? "major" : "other";
  return [k === "other" ? "warn" : "ok", TIERS[k]];
}

function viewIndex(){
  const rows = S.map(s => `<tr>
    <td><span class="grade ${gcls(s.grade)}" aria-label="Grade ${s.grade}">${s.grade}</span></td>
    <td><a class="name" href="#${s.id}">${esc(s.name)}</a><span class="sub">${esc(s.seat)}</span></td>
    ${FIELDS.map(f => `<td>${chip(s.pos[f[0]][0])}</td>`).join("")}</tr>`).join("");
  return `<section><span class="label">US Senate · 5 of 100 records drafted</span>
    <h1>What senators have said about catastrophic risk from AI</h1>
    <p class="lede">Each record gives a grade for how explicitly the senator acknowledges catastrophic or existential risk, their stated position on three policies, and the dated statements behind both.</p></section>
  <section><div class="scroll"><table>
    <thead><tr><th>Grade</th><th>Senator</th><th>Pause</th><th>Slowdown</th><th>Agreement incl. China</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="sub">The grade measures acknowledgment, not policy. A senator can acknowledge the risk and oppose every measure listed.</p></section>
  <section><h2>What this sample shows</h2><ul>
    <li>Three of five grades are borderline. The rubric needs rules for relayed warnings, co-signed letters and bill text. See <a href="#methodology">Methodology</a>.</li>
    <li>Six of fifteen position cells are "No stated position", even for senators chosen because they speak about AI often.</li>
    <li>Almost all useful evidence dates from September 2026. Records built from earlier statements may already be out of date.</li></ul></section>`;
}

function viewSenator(s){
  const i = S.indexOf(s), prev = S[i-1], next = S[i+1];
  const crit = RUBRIC.find(r => r[0] === s.grade)[1];
  return `<section><span class="label">${esc(s.seat)}</span>
    <div class="head"><span class="grade big ${gcls(s.grade)}" aria-label="Grade ${s.grade}">${s.grade}</span>
      <div><h1>${esc(s.name)}</h1><p><strong>Grade ${s.grade}:</strong> ${esc(crit)}</p><p>${esc(s.why)}</p></div></div>
    ${s.flag ? `<div class="flag"><strong>For review.</strong> ${esc(s.flag)}</div>` : ""}</section>
  <section><h2>Stated positions</h2><div class="sheet"><div class="rows">
    ${FIELDS.map(f => `<div class="row"><div class="q">${esc(f[1])}</div><div>${chip(s.pos[f[0]][0])}</div><div class="ev">${esc(s.pos[f[0]][1])}${(s.pos[f[0]][2]||[]).length ? ` <span class="src">${s.pos[f[0]][2].map(x => ext(x[0], x[1])).join(" · ")}</span>` : ""}</div></div>`).join("")}
  </div></div></section>
  <section><h2>Statements</h2><div class="sheet">
    ${s.stmts.map(t => `<div class="stmt"><div class="meta"><span>${esc(t[0])}</span><span>${esc(t[1])}</span>
      <span class="ver ${t[6] ? "ok" : ""}">${t[6] ? "read at source" : "search excerpt only"}</span></div>
      <blockquote>${esc(t[2])}</blockquote><p class="ctx">${esc(t[3])}</p><p class="sub">Source: ${ext(t[4], t[5])} <span class="ver ${tier(t[5])[0]}">${tier(t[5])[1]}</span></p></div>`).join("")}
  </div></section>
  <section><h2>Bills and actions</h2><ul>${s.record.map(r => `<li>${esc(r[0])} <span class="sub">${ext(r[1], r[2])}</span></li>`).join("")}</ul></section>
  ${s.gaps.length ? `<section><h2>Not found</h2><ul>${s.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul></section>` : ""}
  <div class="pager"><span>${prev ? `<a href="#${prev.id}">← ${esc(prev.name)}</a>` : ""}</span><span>${next ? `<a href="#${next.id}">${esc(next.name)} →</a>` : `<a href="#methodology">Methodology →</a>`}</span></div>`;
}

function viewMethod(){
  return `<section><span class="label">Draft v0.1</span><h1>Methodology</h1>
    <p class="lede">The grade records how explicitly a politician acknowledges catastrophic risk from advanced AI. It does not rate whether their policies are good.</p></section>
  <section><h2>Grade rubric</h2><div class="scroll"><table class="rubric"><tbody>
    ${RUBRIC.map(r => `<tr><td><span class="grade ${gcls(r[0])}">${r[0]}</span></td><td>${esc(r[1])}</td></tr>`).join("")}
  </tbody></table></div>
    <p class="sub">Grade colour is one hue that deepens with explicitness. Red and green are avoided so the scale does not read as bad to good.</p></section>
  <section><h2>Position fields</h2><div class="sheet"><div class="rows">
    ${FIELDS.map(f => `<div class="row" style="grid-template-columns:minmax(0,240px) 1fr"><div class="q">${esc(f[1])}</div><div class="ev">${esc(f[2])}</div></div>`).join("")}
  </div>
    <p>Values: ${Object.keys(POS).map(chip).join(" ")}</p>
    <p class="sub">"No" requires a statement against the policy. Silence is always "No stated position".</p></div></section>
  <section><h2>Open questions from the first five records</h2><ul>
    <li><strong>Relayed warnings.</strong> Hawley and Cruz cite experts' extinction warnings without endorsing them. This draft treats relaying as C-level and adds that wording to the rubric. Hawley is still B because of his bill and investigation, which is inconsistent until the next question is settled.</li>
    <li><strong>Bill text and actions.</strong> Should a bill that defines loss-of-control scenarios count as a statement by its sponsor? If not, Hawley drops to C.</li>
    <li><strong>Co-signed letters.</strong> Blumenthal's strongest language is in a 17-senator letter. Full weight would make him an A, and would give the same evidence to all 17 signatories.</li>
    <li><strong>The B/C boundary.</strong> Cruz names catastrophic biological and nuclear risks while dismissing a slowdown. The rubric as written arguably gives him a B.</li>
    <li><strong>Staleness.</strong> Decide how old a statement can be before a record is marked out of date. Slotkin's record rests on statements from before September 2026.</li>
    <li><strong>Quote length.</strong> Quotes here are kept under 15 words with one per source. Short excerpts lose context, so each has a paraphrase and a link.</li></ul></section>
  <section><h2>Source policy</h2><ul>
    <li><strong>Official record:</strong> senate.gov releases, letters, bill text, hearing video. Preferred for every quote.</li>
    <li><strong>Transcript:</strong> a full transcript published by the outlet that ran the interview or covered the hearing.</li>
    <li><strong>Major outlet:</strong> national news organizations. Acceptable for interviews they conducted. For X posts they are a stand-in until the post itself is linked.</li>
    <li><strong>Other outlet:</strong> trade press, aggregators, local affiliates, partisan sites. Usable as a lead only. Each must be replaced by a higher tier or the quote dropped before publication.</li></ul>
    <p class="sub">In this draft ${S.flatMap(s => s.stmts).filter(t => tier(t[5])[0] === "warn").length} of ${S.flatMap(s => s.stmts).length} quotes rest on an "other outlet" source, and ${S.flatMap(s => s.stmts).filter(t => t[1].startsWith("X post")).length} X posts are cited through news reports.</p></section>
  <section><h2>Verification</h2><p>"Read at source" means the linked page was opened and the wording checked there. "Search excerpt only" means the wording was seen in a search result and still needs checking. X posts are not linked directly because the drafting agent cannot open X; each is labelled with the outlet that reported it until the post link is added. The Senate hearing transcript was read in part. Every quote needs an independent human check before publication.</p></section>`;
}

let current = (location.hash || "#index").slice(1);
function render(){
  const id = current;
  const s = S.find(x => x.id === id);
  document.getElementById("view").innerHTML = `<div class="wrap" style="gap:28px">${s ? viewSenator(s) : id === "methodology" ? viewMethod() : viewIndex()}</div>`;
  const cur = s ? "index" : (id === "methodology" ? id : "index");
  document.getElementById("nav").innerHTML = [["index","Senators"],["methodology","Methodology"]]
    .map(n => `<a href="#${n[0]}"${n[0] === cur ? ' aria-current="page"' : ""}>${n[1]}</a>`).join("");
  window.scrollTo(0, 0);
}
// Navigate from clicks directly, so views switch even where the host does not pass hash changes through.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  current = a.getAttribute("href").slice(1) || "index";
  render();
  try { history.replaceState(null, "", "#" + current); } catch (err) { try { location.hash = current; } catch (err2) {} }
});
window.addEventListener("hashchange", () => { const h = (location.hash || "#index").slice(1); if (h !== current) { current = h; render(); } });
render();
</script>
