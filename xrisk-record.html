    <p class="sub">${H && !query.trim() ? `"Representative-elect" marks winners of the 3 November 2026 elections who are not sitting members; they take office on 3 January 2027. "Lame duck" marks sitting representatives who were not among the winners. Seats whose races were not yet called on 15 November 2026 have no member-elect listed. Six sitting representatives who are senators-elect are listed in both chambers.` : `"Senator-elect" and "Representative-elect" mark winners of the 3 November 2026 elections who take office on 3 January 2027. "Lame duck" marks sitting members who will not be in that chamber after that date. "Race undecided" marks a senator whose 2026 race had not been called on 15 November 2026. Two Senate seats, in Minnesota and Tennessee, will be filled by appointment because their senators were elected governor.`}</p></section>
  <section><h2>What this sample shows</h2><ul>
    <li>${all.flatMap(s => Object.values(s.pos)).filter(p => p[0] === "none").length} of ${all.length * FIELDS.length} position cells are "No stated position".</li></ul></section>`;
}

const MAX_STATEMENTS = 5;
const RANK = {A:0, F:0, B:1, C:2, D:3};  // A and F are the two most explicit ends of the scale
const words = q => new Set(q.toLowerCase().match(/[a-z']+/g) || []);
const overlap = (a, b) => { const A = words(a), B = words(b); let n = 0; A.forEach(w => { if (B.has(w)) n++; }); return n / (A.size + B.size - n || 1); };

// Every candidate statement for a senator: those collected by hand, plus posts from X.
function candidates(s){
  const own = s.stmts.map(t => ({iso: isoDate(t[0]), date: t[0], where: t[1], quote: t[2], ctx: t[3], level: t[8], x: /^X post/.test(t[1]),
    sources: [[t[4], t[5]]].concat(t[7] ? [["Post on X", t[7]]] : []), checked: t[6] === 1 ? "wording found on the source page" : t[6] || "search excerpt only", ok: t[6] === 1}));
  const posts = ((XPOSTS[s.id] || {}).posts || []).map(p => ({iso: p.iso, date: p.date, where: "X post, @" + p.handle, quote: p.quote, ctx: p.reason,
    level: p.level, borderline: p.borderline, x: true, sources: [["Post on X", p.url]], checked: "chosen by a language model", ok: 0}));
  return own.concat(posts);
}

// Pick the statements to show. Highest rubric level first. Among statements at the same level,
// prefer the one least like those already picked (wording, month, kind of source), then the
// newest. Near-repeats of a picked quote are skipped.
function statements(s){
  let pool = candidates(s);
  const picked = [];
  while (picked.length < MAX_STATEMENTS && pool.length) {
    const best = Math.min(...pool.map(c => RANK[c.level]));
    const cost = c => (c.borderline ? 0.5 : 0) + picked.reduce((sum, p) =>
      sum + 4 * overlap(c.quote, p.quote) + (c.iso.slice(0, 7) === p.iso.slice(0, 7) ? 2 : 0) + (c.x === p.x ? 1 : 0), 0);
    const next = pool.filter(c => RANK[c.level] === best)
      .sort((a, b) => cost(a) - cost(b) || b.iso.localeCompare(a.iso))[0];
    picked.push(next);
    pool = pool.filter(c => c !== next && overlap(c.quote, next.quote) <= 0.6);
  }
  return picked.sort((a, b) => b.iso.localeCompare(a.iso));
}

// How to reach a sitting member: their Washington office phone and their contact form or official website.
// Members of Congress do not publish email addresses; they take messages through a form on their website.
function contactLine(s){
  const c = CONTACTS[s.bioguide];
  if (!c) return "";
  return `<p class="contact"><strong>Contact the Washington office:</strong> <a href="tel:+1-${esc(c[0])}">${esc(c[0])}</a> · ${c[2] ? ext("Send a message (contact form)", c[2]) : ext("Send a message through the official website", c[1])}</p>`;
}
// The X accounts searched for this person, each linked to its profile.
function accountsLine(s){
  const a = ACCOUNTS[s.bioguide] || [];
  return `<p class="sub" style="max-width:none">${a.length ? `X account${a.length > 1 ? "s" : ""} searched: ${a.map(x => `<span style="white-space:nowrap">${ext("@" + x[0], "https://x.com/" + x[0])} (${esc(x[1])})</span>`).join(" · ")}` : "No X account was found for this person."}</p>`;
}
function viewSenator(s){
  const L = S.filter(x => house(x) === house(s)), i = L.indexOf(s), prev = L[i-1], next = L[i+1], x = XPOSTS[s.id], st = STATUS[s.id];
  const crit = RUBRIC.find(r => r[0] === s.grade)[1];
  return `<section><span class="label">${esc(s.seat)}</span>
    <div class="head"><img class="photo" src="img/${s.bioguide}.jpg" alt="Official portrait of ${esc(s.name)}" onerror="this.remove()"><span class="grade big ${gcls(s.grade)}" aria-label="Grade ${s.grade}">${s.grade}</span>
      <div><h1>${esc(s.name)}${st ? `<span class="status">${STATUS_NAME[st.kind]}</span>` : ""}</h1>${st ? `<p class="sub">${esc(st.note)} ${st.url ? ext(st.label, st.url) : ""}</p>` : ""}<p><strong>Grade ${s.grade}.</strong> ${esc(s.why)}</p>${contactLine(s)}</div></div></section>
  <section><h2>Stated positions</h2><div class="sheet"><div class="rows">
    ${FIELDS.map(f => `<div class="row"><div class="q">${esc(f[1])}</div><div>${chip(s.pos[f[0]][0])}</div><div class="ev">${s.pos[f[0]][0] === "none" ? "" : `${esc(s.pos[f[0]][1])}${(s.pos[f[0]][2]||[]).length ? ` <span class="src">${s.pos[f[0]][2].map(x => ext(x[0], x[1])).join(" · ")}</span>` : ""}`}</div></div>`).join("")}
  </div></div></section>
  <section><h2>Statements</h2>
    ${accountsLine(s)}
    ${candidates(s).length ? "" : `<p>No statements about AI risk have been found yet.</p>`}
    <div class="sheet">
    ${statements(s).map(t => `<div class="stmt"><div class="meta"><span>${esc(t.date)}</span><span>${esc(t.where)}</span>
      <span class="ver ${t.ok ? "ok" : ""}">${t.checked}</span></div>
      <blockquote>${esc(t.quote)}</blockquote><p class="ctx">${esc(t.ctx)}</p><p class="sub">Source: ${t.sources.map(x => `${ext(x[0], x[1])} <span class="ver ${tier(x[1])[0]}">${tier(x[1])[1]}</span>`).join(" · ")}</p></div>`).join("")}
  </div></section>
  ${s.record.length ? `<section><h2>Bills and actions</h2><ul>${s.record.map(r => `<li>${esc(r[0])} <span class="sub">${ext(r[1], r[2])}</span></li>`).join("")}</ul></section>` : ""}
  ${s.gaps.length ? `<section><h2>Not found</h2><ul>${s.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul></section>` : ""}
  <div class="pager"><span>${prev ? `<a href="#${prev.id}">← ${esc(prev.name)}</a>` : ""}</span><span>${next ? `<a href="#${next.id}">${esc(next.name)} →</a>` : `<a href="#methodology">Methodology →</a>`}</span></div>`;
}

const CONTACT_EMAIL = "contact@airiskrecord.org";
function viewMethod(){
  return `<section><span class="label">Rubric version 0.2</span><h1>Methodology</h1>
    <p class="lede" style="max-width:none">The grade records how explicitly a politician acknowledges catastrophic risk from advanced AI.</p>
    <p>This record tracks one thing: what politicians have said about catastrophic risk from AI. Other consequences of AI, such as job loss, economic disruption, the impact of data centers and concentration of power, are real and important. They are outside the scope of this record, and a grade says nothing about a politician's record on them.</p></section>
  <section><h2>Grade rubric</h2><div class="scroll"><table class="rubric"><tbody>
    ${RUBRIC.map(r => `<tr><td><span class="grade ${gcls(r[0])}">${r[0]}</span></td><td>${esc(r[1])}</td></tr>`).join("")}
  </tbody></table></div></section>
  <section><h2>Position fields</h2><div class="sheet"><div class="rows">
    ${FIELDS.map(f => `<div class="row" style="grid-template-columns:minmax(0,240px) 1fr"><div class="q">${esc(f[1])}</div><div class="ev">${esc(f[2])}</div></div>`).join("")}
  </div>
    <p>Values: ${Object.keys(POS).map(chip).join(" ")}</p>
    <p class="sub">"No" requires a statement against the policy. Silence is always "No stated position".</p></div></section>
  <section><h2>How statements are collected and chosen</h2>
    <p>Statements come from two places: posts on the politician's X accounts from ${esc((Object.values(XPOSTS)[0] || {since: "1 January 2025"}).since)} onward that match AI-related keywords (${(Object.values(XPOSTS).reduce((n, x) => n + x.total, 0) + XHOUSE.reduce((n, r) => n + (r.posts || 0), 0)).toLocaleString("en-US")} posts across both chambers), and a web search of news reports and official records such as press releases, letters, bills, speeches and interviews. A language model reads each one and labels it against the rubric. Every Senate grade is then reviewed by a person. House grades are worked out by rule from the labels and have only been roughly checked by a person.</p>
    <p>Each page shows at most ${MAX_STATEMENTS} statements: those that most explicitly address catastrophic risk, chosen for variety of wording, date and source, newest first. Statements that do not address catastrophic risk are shown only in places left over after the stronger ones. Where a person has not set the grade by hand, it is worked out from the levels the statements reached, using the rulings below.</p></section>
  <section><h2>Rulings</h2><ul>
    <li><strong>Relayed warnings.</strong> Citing someone else's warning without endorsing it is C. A warning the politician endorses in their own words counts as their own statement.</li>
    <li><strong>Bills and actions.</strong> Sponsoring a bill or opening an investigation about catastrophic risk does not by itself earn a B. A statement in the politician's own words is needed.</li>
    <li><strong>Co-signed letters.</strong> A co-signed letter counts as the signer's statement, graded on the letter's own wording.</li>
    <li><strong>Threat to humanity.</strong> Saying AI threatens the future of humanity or the human race is A, even without the word extinction.</li>
    <li><strong>Military use.</strong> Calls for human control of autonomous weapons or nuclear launch are about military use of AI, not catastrophic risk from AI itself.</li>
    <li><strong>Recent statements.</strong> Statements from 2026 count for much more than statements from 2025.</li>
    <li><strong>Dismissing the risk.</strong> A statement that dismisses or mocks catastrophic risk lowers the grade by one letter. A politician with several such statements still loses only one letter. Someone who has only dismissed the risk is F. A D can therefore also mean a general acknowledgment (C) lowered by a dismissive statement.</li>
    <li><strong>Misuse only.</strong> Naming catastrophic harm only from people misusing AI, such as for biological weapons or cyberattacks, is C.</li>
    <li><strong>Rogue AI.</strong> Statements about AI agents escaping or hacking are graded by the harm they name. Cybercrime alone is not catastrophic risk.</li></ul></section>
  <section><h2>Source policy</h2><ul>
    <li><strong>Official record:</strong> senate.gov and house.gov releases, letters, bill text, hearing video. Preferred for every quote.</li>
    <li><strong>Transcript:</strong> a full transcript published by the outlet that ran the interview or covered the hearing.</li>
    <li><strong>Major outlet:</strong> national news organizations. Acceptable for interviews they conducted. For X posts they are a stand-in until the post itself is linked.</li>
    <li><strong>Other outlet:</strong> trade press, aggregators, local affiliates, partisan sites. Used where no better source was found.</li></ul></section>
  <section><h2>Verification</h2><p>Each quote is marked with the check it has had. "Wording found on the source page" means the quoted words appear on the linked page. For most quotes a script made that check; it does not confirm who said the words, the date, or the surrounding context. "Checked against the source by a person" means a person opened the page and read the quote there. "Search excerpt only" means the wording was seen in a search result and still needs checking. The Senate hearing transcript was read in part.</p>
    <p><strong>What a person has reviewed.</strong> Every Senate grade has been reviewed by a person, and some were changed by hand. House grades are worked out by rule from the statements found and have only been roughly checked by a person. Policy positions and most quotes in both chambers come from a language model, with automatic checks that the quoted words appear on the linked page.</p>
    <p>X posts were collected through the X API and link to the post itself. Those marked "chosen by a language model" were selected and described by a model reading the post text only, without attached video, images or links.</p>
    <p>Portraits are official congressional photographs from the public-domain unitedstates/images collection.</p></section>
  <section><h2>Contact</h2>
    <p>Found a mistake? Or think we've missed something? <a href="mailto:${CONTACT_EMAIL}">Let us know</a> at ${CONTACT_EMAIL}. The code and data behind this site are ${ext("on GitHub", "https://github.com/OzAmram/ai-risk-record-website")}.</p>
    <p>This website was written and is maintained by ${ext("Oz Amram", "https://ozamram.github.io/")}.</p></section>`;
}

// The address after "#", with accented letters decoded (so "#luj%C3%A1n" finds "luján").
const fromHash = () => { const h = (location.hash || "#index").slice(1); try { return decodeURIComponent(h); } catch (err) { return h; } };
let current = fromHash();
function render(keepScroll){
  const id = current;
  const s = S.find(x => x.id === id);
  document.getElementById("view").innerHTML = `<div class="wrap" style="gap:28px">${s ? viewSenator(s) : id === "methodology" ? viewMethod() : viewIndex()}</div>`;
  const cur = s ? "index" : (id === "methodology" ? id : "index");
  document.getElementById("nav").innerHTML = [["index","Members"],["methodology","Methodology"]]
    .map(n => `<a href="#${n[0]}"${n[0] === cur ? ' aria-current="page"' : ""}>${n[1]}</a>`).join("");
  if (!keepScroll) window.scrollTo(0, 0);
}
// Search box: typing filters the table on the index page (and goes there from any other page).
// While there is search text the map and chart are hidden, so the results are at the top.
const box = document.getElementById("q");
function search(text){ query = text; box.value = text; current = "index"; render(); }
box.addEventListener("input", () => search(box.value));
// Zip code box on the index page: looking up a zip code is a search for it.
document.addEventListener("submit", e => { if (e.target.id === "zipform") { e.preventDefault(); search(document.getElementById("zip").value.trim()); } });
// Map: hover or focus shows a state's senators; click lists them in the table.
const stateAt = e => e.target.closest && e.target.closest("path[data-state]");
function showTip(e){
  const tip = document.getElementById("tip"), p = stateAt(e);
  if (!tip) return;
  if (!p) { tip.hidden = true; return; }
  tip.innerHTML = tipFor(p.dataset.state); tip.hidden = false;
  const area = tip.parentNode.getBoundingClientRect(), r = p.getBoundingClientRect();
  const x = (e.clientX || r.left + r.width / 2) - area.left, y = (e.clientY || r.top + r.height / 2) - area.top;
  tip.style.left = Math.max(0, Math.min(x + 14, area.width - tip.offsetWidth)) + "px";
  tip.style.top = (y + 18 + tip.offsetHeight > area.height + 60 ? y - tip.offsetHeight - 12 : y + 18) + "px";
}
document.addEventListener("pointermove", showTip);
document.addEventListener("focusin", showTip);
document.addEventListener("keydown", e => { if (e.key === "Enter" && stateAt(e)) search(stateAt(e).dataset.state); });
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button[data-senate]");
  const c = e.target.closest && e.target.closest("button[data-chamber]");
  if (c) { chamber = c.dataset.chamber; render(true); const again = document.querySelector(`button[data-chamber="${chamber}"]`); if (again) again.focus(); return; }
  const pol = e.target.closest && e.target.closest("button[data-policy]");
  if (pol) { policy = pol.dataset.policy; render(true); const again = document.querySelector(`button[data-policy="${policy}"]`); if (again) again.focus(); return; }
  if (b) { senate = b.dataset.senate; render(true); const again = document.querySelector(`button[data-senate="${senate}"]`); if (again) again.focus(); }
  else if (stateAt(e)) search(stateAt(e).dataset.state);
  else if (e.target.id === "clear") query = box.value = "";
});
// Navigate from clicks directly, so views switch even where the host does not pass hash changes through.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  current = a.getAttribute("href").slice(1) || "index";
  render();
  try { history.replaceState(null, "", "#" + current); } catch (err) { try { location.hash = current; } catch (err2) {} }
});
window.addEventListener("hashchange", () => { const h = fromHash(); if (h !== current) { current = h; render(); } });
render();
</script>
