const MAX_STATEMENTS = 5;
const RANK = {A:0, F:0, B:1, C:2, D:3};  // A and F are the two most explicit ends of the scale
const words = q => new Set(q.toLowerCase().match(/[a-z']+/g) || []);
const overlap = (a, b) => { const A = words(a), B = words(b); let n = 0; A.forEach(w => { if (B.has(w)) n++; }); return n / (A.size + B.size - n || 1); };

// Every candidate statement for a senator: those collected by hand, plus posts from X.
function candidates(s){
  const own = s.stmts.map(t => ({iso: isoDate(t[0]), date: t[0], where: t[1], quote: t[2], ctx: t[3], level: t[8], x: /^X post/.test(t[1]),
    sources: [[t[4], t[5]]].concat(t[7] ? [["Post on X", t[7]]] : []), checked: t[6] === 1 ? "read at source" : t[6] || "search excerpt only", ok: t[6] === 1}));
  const posts = ((XPOSTS[s.id] || {}).posts || []).map(p => ({iso: p.iso, date: p.date, where: "X post, @" + p.handle, quote: p.quote, ctx: p.reason,
    level: p.level, borderline: p.borderline, x: true, sources: [["Post on X", p.url]], checked: "chosen by a language model", ok: 0}));
  return own.concat(posts);
}

// Pick the statements to show. Highest rubric level first. Among statements at the same level,
// prefer the one least like those already picked (wording, month, kind of source), then the
// newest. Near-repeats of a picked quote are skipped.
function statements(s){
  let pool = candidates(s);
  const picked = [];
  while (picked.length < MAX_STATEMENTS && pool.length) {
    const best = Math.min(...pool.map(c => RANK[c.level]));
    const cost = c => (c.borderline ? 0.5 : 0) + picked.reduce((sum, p) =>
      sum + 4 * overlap(c.quote, p.quote) + (c.iso.slice(0, 7) === p.iso.slice(0, 7) ? 2 : 0) + (c.x === p.x ? 1 : 0), 0);
    const next = pool.filter(c => RANK[c.level] === best)
      .sort((a, b) => cost(a) - cost(b) || b.iso.localeCompare(a.iso))[0];
    picked.push(next);
    pool = pool.filter(c => c !== next && overlap(c.quote, next.quote) <= 0.6);
  }
  return picked.sort((a, b) => b.iso.localeCompare(a.iso));
}

function render(keepScroll){
  const id = current;
  const s = S.find(x => x.id === id);
  document.getElementById("view").innerHTML = `<div class="wrap" style="gap:28px">${s ? viewSenator(s) : id === "methodology" ? viewMethod() : viewIndex()}</div>`;
  const cur = s ? "index" : (id === "methodology" ? id : "index");
  document.getElementById("nav").innerHTML = [["index","Senators"],["methodology","Methodology"]]
    .map(n => `<a href="#${n[0]}"${n[0] === cur ? ' aria-current="page"' : ""}>${n[1]}</a>`).join("");
  if (!keepScroll) window.scrollTo(0, 0);
}
// Search box: typing filters the table on the index page (and goes there from any other page).
// While there is search text the map and chart are hidden, so the results are at the top.
const box = document.getElementById("q");
function search(text){ query = text; box.value = text; current = "index"; render(); }
box.addEventListener("input", () => search(box.value));
// Map: hover or focus shows a state's senators; click lists them in the table.
const stateAt = e => e.target.closest && e.target.closest("path[data-state]");
function showTip(e){
  const tip = document.getElementById("tip"), p = stateAt(e);
  if (!tip) return;
  if (!p) { tip.hidden = true; return; }
  tip.innerHTML = tipFor(p.dataset.state); tip.hidden = false;
  const area = tip.parentNode.getBoundingClientRect(), r = p.getBoundingClientRect();
  const x = (e.clientX || r.left + r.width / 2) - area.left, y = (e.clientY || r.top + r.height / 2) - area.top;
  tip.style.left = Math.max(0, Math.min(x + 14, area.width - tip.offsetWidth)) + "px";
  tip.style.top = (y + 18 + tip.offsetHeight > area.height + 60 ? y - tip.offsetHeight - 12 : y + 18) + "px";
}
document.addEventListener("pointermove", showTip);
document.addEventListener("focusin", showTip);
document.addEventListener("keydown", e => { if (e.key === "Enter" && stateAt(e)) search(stateAt(e).dataset.state); });
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button[data-senate]");
  if (b) { senate = b.dataset.senate; render(true); const again = document.querySelector(`button[data-senate="${senate}"]`); if (again) again.focus(); }
  else if (stateAt(e)) search(stateAt(e).dataset.state);
  else if (e.target.id === "clear") query = box.value = "";
});
// Navigate from clicks directly, so views switch even where the host does not pass hash changes through.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  current = a.getAttribute("href").slice(1) || "index";
  render();
  try { history.replaceState(null, "", "#" + current); } catch (err) { try { location.hash = current; } catch (err2) {} }
});
window.addEventListener("hashchange", () => { const h = fromHash(); if (h !== current) { current = h; render(); } });
render();
</script>
